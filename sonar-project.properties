sonar.projectKey=ckoval7_fielddaycommander-relay
sonar.organization=ckoval7

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# theme.css and the compiled app.css are generated, by scripts/sync-theme.cjs and
# scripts/build-css.cjs.
sonar.exclusions=**/*_test.go,node_modules/**,dist/**,LICENSES/**,assets/**,internal/ui/web/assets/app.css,internal/ui/styles/theme.css

sonar.go.coverage.reportPaths=coverage.out
# Windows-only files can't run on the Linux CI machine, and only Go reports coverage.
sonar.coverage.exclusions=**/*_windows.go,scripts/**,internal/ui/web/**,internal/ui/styles/**
